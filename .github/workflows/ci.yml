name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: routeos
          POSTGRES_PASSWORD: routeos_dev_password
          POSTGRES_DB: routeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations
        working-directory: ./backend
        env:
          DATABASE_URL_SYNC: postgresql+psycopg://routeos:routeos_dev_password@localhost:5432/routeos
          DATABASE_URL: postgresql+asyncpg://routeos:routeos_dev_password@localhost:5432/routeos
          REDIS_URL: redis://localhost:6379/0
        run: |
          alembic upgrade head

      - name: Seed test data
        working-directory: ./backend
        env:
          DATABASE_URL_SYNC: postgresql+psycopg://routeos:routeos_dev_password@localhost:5432/routeos
          DATABASE_URL: postgresql+asyncpg://routeos:routeos_dev_password@localhost:5432/routeos
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m scripts.seed_data

      - name: Run Pytest suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://routeos:routeos_dev_password@localhost:5432/routeos
          DATABASE_URL_SYNC: postgresql+psycopg://routeos:routeos_dev_password@localhost:5432/routeos
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
          METRICS_PUBLIC: "true"
        run: |
          pytest -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm install

      - name: Run TypeScript typecheck
        working-directory: ./frontend
        run: |
          npx tsc --noEmit

      - name: Run Production build
        working-directory: ./frontend
        run: |
          npm run build
